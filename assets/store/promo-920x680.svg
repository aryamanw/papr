<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="920" height="680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf8f2"/>
      <stop offset="100%" stop-color="#f0e6d4"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75"
                    numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <!-- Background gradient -->
  <rect width="920" height="680" fill="url(#bg)"/>
  <!-- Paper grain -->
  <rect width="920" height="680" filter="url(#grain)" opacity="0.12"
        style="mix-blend-mode:multiply"/>
  <!-- Wordmark -->
  <text x="460" y="288"
        font-family="Georgia, serif" font-size="96" font-weight="700"
        fill="#4a3728" text-anchor="middle" letter-spacing="-2">Papr</text>
  <!-- Amber rule -->
  <rect x="428" y="308" width="64" height="3" rx="1.5" fill="#c4924a"/>
  <!-- Tagline -->
  <text x="460" y="348"
        font-family="Georgia, serif" font-size="22"
        fill="#9c7d5e" text-anchor="middle">A paper texture overlay for Chrome.</text>
  <text x="460" y="378"
        font-family="Georgia, serif" font-size="22"
        fill="#9c7d5e" text-anchor="middle">Easier on the eyes, all day long.</text>
</svg>
